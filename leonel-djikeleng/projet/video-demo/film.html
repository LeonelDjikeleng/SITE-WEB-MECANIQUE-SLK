<!doctype html><html lang="fr-CA"><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url(assets/fonts/fraunces.woff2) format("woff2");font-weight:300 800}
@font-face{font-family:FI;src:url(assets/fonts/fraunces-italique.woff2) format("woff2");font-weight:300 800}
@font-face{font-family:H;src:url(assets/fonts/hanken-grotesk.woff2) format("woff2");font-weight:300 800}
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#171717}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 40%}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,12,16,.9) 0%,rgba(10,12,16,.55) 38%,rgba(10,12,16,0) 65%)}
.txt{position:absolute;left:34px;right:34px;bottom:120px;color:#F7F6F4}
.eb{font:600 12px/1 H;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:12px;opacity:.88}
.eb:before{content:"";width:22px;height:1px;background:#F7F6F4}
.big{font:500 54px/1.02 F;letter-spacing:-.02em;margin-top:14px}
.it{font-family:FI;font-weight:400}
.end{background:#F7F6F4;color:#171717}
.end .in{position:absolute;left:34px;right:34px;top:50%;transform:translateY(-50%)}
.end .nm{font:600 44px/1.04 F;letter-spacing:-.02em}
.end .sv{margin-top:14px;font:500 16px/1.45 H;color:#5C5C5C}
.end .tel{margin-top:28px;display:inline-block;font:600 20px/1 H;padding:16px 24px;border-radius:999px;background:#171717;color:#F7F6F4;letter-spacing:.01em}
.end .eb{color:#5C5C5C}.end .eb:before{background:#1F3B63}
.mention{position:absolute;left:34px;right:34px;bottom:34px;font:400 11px/1.3 H;color:#8a8a8a}
.bar{position:absolute;left:34px;right:34px;top:40px;height:2px;background:rgba(247,246,244,.25)}
.bar i{display:block;height:100%;width:0;background:#F7F6F4}
</style></head><body>
<div class="sc" id="s1"><img src="assets/img/quebec-hiver-mobile.webp" style="object-position:50% 0"><div class="shade"></div>
 <div class="txt"><div class="eb">Québec</div><div class="big">Montrez votre entreprise.</div></div></div>
<div class="sc" id="s2"><img src="assets/img/garage-1200.webp" style="object-position:58% 50%"><div class="shade"></div>
 <div class="txt"><div class="eb">Garages</div><div class="big">Votre atelier,</div></div></div>
<div class="sc" id="s3"><img src="assets/img/plomberie-1200.webp" style="object-position:40% 50%"><div class="shade"></div>
 <div class="txt"><div class="eb">Plombiers</div><div class="big">votre savoir-faire,</div></div></div>
<div class="sc" id="s4"><img src="assets/img/chantier-1200.webp" style="object-position:35% 50%"><div class="shade"></div>
 <div class="txt"><div class="eb">Entrepreneurs</div><div class="big"><span class="it">en 30 secondes.</span></div></div></div>
<div class="sc end" id="s5"><div class="in"><div class="eb">Vidéo publicitaire</div>
 <div class="nm" style="margin-top:16px">Léonel Djikeleng</div>
 <div class="sv">Vidéos publicitaires, sites web<br>et automatisations · Québec</div>
 <div class="tel">418 255-7236</div></div>
 <div class="mention">Démonstration réalisée avec des photos libres de droits (Pexels).</div></div>
<div class="bar"><i id="pb"></i></div>
<script>
const D=15, sc=[[0,3.3],[3.0,6.3],[6.0,9.3],[9.0,12.3],[12.0,15.0]], X=0.35;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
window.render=function(t){
 sc.forEach(([a,b],i)=>{const el=document.getElementById('s'+(i+1));
  let o=0; if(t>=a&&t<=b){o=Math.min(1,(t-a)/X); if(i===0)o=t<0.3?t/0.3:1; if(i<4&&t>b-X)o=Math.min(o,(b-t)/X);} 
  if(i===4&&t>=a)o=Math.min(1,(t-a)/X);
  el.style.opacity=o;
  const img=el.querySelector('img'); if(img){const p=(t-a)/(b-a); img.style.transform=`scale(${1.12-0.1*Math.max(0,Math.min(1,p))})`;}
  const tx=el.querySelector('.txt,.in'); if(tx){const k=ease((t-a-0.25)/0.6); tx.style.opacity=k; tx.style.transform=(i===4?'translateY(-50%) ':'')+`translateY(${(1-k)*18}px)`;}
 });
 document.getElementById('pb').style.width=Math.min(100,t/12*100)+'%';
 document.querySelector('.bar').style.opacity=t<12?1:Math.max(0,1-(t-12)/0.3);
};
render(0);
</script></body></html>
